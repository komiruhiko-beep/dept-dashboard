<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结构加工事业部 · 运营看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;
  --bg2:#0f1628;
  --bg3:#141d35;
  --bg4:#1a2540;
  --border:#1e2d4a;
  --border2:#243354;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --accent-glow:rgba(59,130,246,.25);
  --cyan:#06b6d4;
  --green:#10b981;
  --amber:#f59e0b;
  --red:#ef4444;
  --purple:#8b5cf6;
  --text1:#e8edf5;
  --text2:#8fa3c4;
  --text3:#4d6280;
}
html,body{height:100%}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text1);font-size:13px;min-height:100vh}

/* ── 登录页 ── */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,.12) 0%,transparent 70%)}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.4}
.login-box{position:relative;background:linear-gradient(135deg,rgba(15,22,40,.95),rgba(20,29,53,.95));border:1px solid var(--border2);border-radius:20px;padding:2.8rem 2.2rem;width:360px;box-shadow:0 0 60px rgba(59,130,246,.15),0 30px 80px rgba(0,0,0,.5)}
.login-glow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:200px;height:80px;background:var(--accent);filter:blur(50px);opacity:.3;border-radius:50%}
.login-logo{text-align:center;margin-bottom:18px}
.login-logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--cyan));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 30px var(--accent-glow)}
.login-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:3px;color:var(--text1);letter-spacing:.5px}
.login-corp{font-size:11px;color:var(--text3);text-align:center;margin-bottom:28px;letter-spacing:1px;text-transform:uppercase}
.login-label{font-size:11px;color:var(--text2);margin-bottom:7px;font-weight:500;letter-spacing:.3px}
.login-input{width:100%;padding:10px 14px;border:1px solid var(--border2);border-radius:10px;font-size:13px;outline:none;transition:all .2s;margin-bottom:14px;background:rgba(255,255,255,.04);color:var(--text1)}
.login-input::placeholder{color:var(--text3)}
.login-input:focus{border-color:var(--accent);background:rgba(59,130,246,.06);box-shadow:0 0 0 3px var(--accent-glow)}
.login-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.5px;transition:all .2s;box-shadow:0 4px 20px var(--accent-glow)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(59,130,246,.4)}
.login-err{font-size:11px;color:var(--red);text-align:center;margin-top:10px;min-height:16px}
.hidden{display:none!important}

/* ── 顶部导航 ── */
.header{background:linear-gradient(90deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;height:56px}
.header-brand{display:flex;align-items:center;gap:10px}
.header-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 12px var(--accent-glow)}
.header-title{font-size:15px;font-weight:700;color:var(--text1);letter-spacing:.3px}
.header-sub{font-size:10px;color:var(--text3);margin-top:1px}
.header-right{display:flex;gap:8px;align-items:center}
.header-badge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:500;letter-spacing:.3px}
.badge-admin{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.badge-time{background:var(--bg4);color:var(--text2);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.h-select{font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--bg4);color:var(--text1);outline:none;cursor:pointer}
.h-btn{font-size:11px;padding:5px 12px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;letter-spacing:.3px}
.h-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── 主体 ── */
.main{max-width:1500px;margin:0 auto;padding:20px 24px}

/* ── 标签栏 ── */
.tab-row{display:flex;gap:2px;margin-bottom:20px;background:var(--bg2);border:1px solid var(--border);padding:4px;border-radius:10px;width:fit-content}
.tab{font-size:11px;padding:6px 14px;border-radius:7px;cursor:pointer;border:none;background:transparent;color:var(--text2);font-weight:500;white-space:nowrap;letter-spacing:.3px;transition:all .2s}
.tab:hover{color:var(--text1)}
.tab.active{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 2px 12px var(--accent-glow)}
.panel{display:none}.panel.active{display:block}

/* ── 上传区 ── */
.upload-zone{border:1px dashed var(--border2);border-radius:12px;padding:2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg3);margin-bottom:20px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(59,130,246,.06)}
.upload-status{font-size:11px;margin-top:10px;padding:7px 14px;border-radius:7px;display:none}
.status-ok{background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.status-err{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.status-loading{background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.3)}

/* ── KPI 卡片 ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .3s}
.kpi:hover{border-color:var(--border2)}
.kpi:hover::before{opacity:1}
.kpi-label{font-size:10px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px;font-weight:500}
.kpi-val{font-size:22px;font-weight:700;color:var(--text1);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:5px}
.kpi-accent{border-color:rgba(59,130,246,.4)}
.kpi-accent::before{opacity:1;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.up{color:var(--green)}.down{color:var(--red)}

/* ── 区块卡片 ── */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.8px}
.card-title-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 6px var(--accent);display:inline-block}

/* ── 全屏图表弹层 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:8000;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:24px;width:92vw;height:86vh;display:flex;flex-direction:column;box-shadow:0 0 80px rgba(59,130,246,.1),0 40px 100px rgba(0,0,0,.6)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:13px;font-weight:600;color:var(--text1);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
.modal-close{font-size:18px;color:var(--text3);cursor:pointer;line-height:1;border:none;background:none;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--bg4);color:var(--text1)}
.modal-body{flex:1;position:relative;min-height:0}
.chart-expand{font-size:10px;padding:3px 9px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;letter-spacing:.3px;transition:all .15s}
.chart-expand:hover{border-color:var(--accent);color:var(--accent)}

/* ── 车间卡片 ── */
.ws-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.ws-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.ws-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-glow),transparent);opacity:0;transition:opacity .2s;pointer-events:none}
.ws-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.ws-card:hover::after{opacity:1}
.ws-card.prod{border-left:2px solid var(--accent)}
.ws-card.cost-only{border-left:2px solid var(--amber)}
.ws-name{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;color:var(--text1)}
.ws-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ws-m-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.ws-m-val{font-size:12px;font-weight:600;color:var(--text1);margin-top:2px}
.pill{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600;letter-spacing:.3px}
.pill-ok{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.pill-warn{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.pill-bad{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}

/* ── 车间详情弹层 ── */
.ws-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:7000;display:flex;align-items:center;justify-content:center}
.ws-modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:88vw;max-height:90vh;overflow-y:auto;padding:22px 26px;box-shadow:0 0 60px rgba(59,130,246,.1),0 40px 100px rgba(0,0,0,.6)}
.ws-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.ws-modal-title{font-size:15px;font-weight:700;color:var(--text1);display:flex;align-items:center;gap:8px}
.ws-modal-title::before{content:'';width:4px;height:18px;background:linear-gradient(var(--accent),var(--cyan));border-radius:2px;display:block}

/* ── 表格 ── */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{text-align:right;padding:8px 8px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg);text-transform:uppercase;letter-spacing:.5px;font-size:10px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:right;color:var(--text2)}
.tbl td:first-child{font-weight:600;white-space:nowrap;color:var(--text1)}
.tbl tr:hover td{background:rgba(59,130,246,.05)}
.tbl tr.tot td{font-weight:700;border-top:1px solid var(--border2);background:var(--bg4);color:var(--text1)}

/* ── 进度条 ── */
.bar-bg{height:4px;background:var(--bg4);border-radius:2px;margin-top:6px;overflow:hidden}
.bar-fill{height:4px;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── 分割线区块标题 ── */
.section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

.charts-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.no-data{text-align:center;padding:4rem;color:var(--text3);font-size:13px;letter-spacing:.3px}
.no-data-icon{font-size:40px;margin-bottom:12px;opacity:.4}
select{outline:none}

/* ── 滚动条 ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .ws-grid{grid-template-columns:1fr}
  .charts-row{grid-template-columns:1fr}
  .main{padding:12px}
  .tab-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-screen" id="loginScreen">
  <div class="login-bg"></div>
  <div class="login-grid"></div>
  <div class="login-box">
    <div class="login-glow"></div>
    <div class="login-logo"><div class="login-logo-icon">📊</div></div>
    <div class="login-title">运营数据看板</div>
    <div class="login-corp">结构加工事业部 · Operations Dashboard</div>
    <div class="login-label">访问密码</div>
    <input class="login-input" type="password" id="loginPwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">进 入 系 统</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 全屏图表弹层 -->
<div class="modal-overlay hidden" id="chartModal" onclick="closeChartModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title"><span class="card-title-dot"></span><span id="modalTitle"></span></span>
      <button class="modal-close" onclick="closeChartModal()">✕</button>
    </div>
    <div class="modal-body"><canvas id="modalCanvas"></canvas></div>
  </div>
</div>

<!-- 车间详情弹层 -->
<div class="ws-modal hidden" id="wsModal" onclick="closeWsModal(event)">
  <div class="ws-modal-box" onclick="event.stopPropagation()">
    <div class="ws-modal-header">
      <span class="ws-modal-title" id="wsModalTitle"></span>
      <button class="modal-close" onclick="closeWsModal()">✕</button>
    </div>
    <div id="wsModalBody"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="appRoot" class="hidden">
  <div class="header">
    <div class="header-brand">
      <div class="header-icon">📊</div>
      <div>
        <div class="header-title">结构加工事业部</div>
        <div class="header-sub" id="dataSourceLabel">OPERATIONS DASHBOARD</div>
      </div>
    </div>
    <div class="header-right">
      <select class="h-select" id="monthSel" onchange="onMonthChange()" style="display:none"></select>
      <span class="header-badge badge-admin" id="adminTag" style="display:none">🔑 ADMIN</span>
      <span class="header-badge badge-time" id="clockBadge"></span>
      <button class="h-btn" onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="main">
    <!-- 管理员上传区 -->
    <div id="adminBar" class="hidden">
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="event.preventDefault();this.classList.remove('drag');handleDrop(event)">
        <div style="font-size:28px;margin-bottom:8px;opacity:.6">📂</div>
        <div style="font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text1)">上传「事业部各车间成本.xlsx」</div>
        <div style="font-size:11px;color:var(--text3)">点击选择或拖拽文件 · 上传后自动保存</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this)">
        <div id="uploadStatus" class="upload-status"></div>
      </div>
    </div>

    <!-- 标签页 -->
    <div class="tab-row">
      <button class="tab active" onclick="showTab('overview',this)">总览</button>
      <button class="tab" onclick="showTab('workshop',this)">各车间看板</button>
      <button class="tab" onclick="showTab('compare',this)">车间对比</button>
      <button class="tab" onclick="showTab('cost',this)">成本明细</button>
      <button class="tab" onclick="showTab('profit',this)">利润分析</button>
      <button class="tab" onclick="showTab('efficiency',this)">效率指标</button>
      <button class="tab" onclick="showTab('machine',this)">流机管控</button>
    </div>

    <div class="panel active" id="panel-overview"><div class="no-data"><div class="no-data-icon">📊</div>暂无数据 · 请管理员上传 Excel</div></div>
    <div class="panel" id="panel-workshop"><div class="no-data"><div class="no-data-icon">🏭</div>暂无数据</div></div>
    <div class="panel" id="panel-compare"><div class="no-data"><div class="no-data-icon">📊</div>暂无数据</div></div>
    <div class="panel" id="panel-cost"><div class="no-data"><div class="no-data-icon">💰</div>暂无数据</div></div>
    <div class="panel" id="panel-profit"><div class="no-data"><div class="no-data-icon">📈</div>暂无数据</div></div>
    <div class="panel" id="panel-efficiency"><div class="no-data"><div class="no-data-icon">⚡</div>暂无数据</div></div>
    <div class="panel" id="panel-machine"><div class="no-data"><div class="no-data-icon">🔧</div>暂无数据</div></div>
  </div>
</div>

<script>
// ══ 密码配置 ══
const VIEWER_PWD = 'view2026';
const ADMIN_PWD  = 'admin2026';
// ════════════

const STORAGE_KEY = 'dept_db_v2';
const COST_SHEETS = ['冷加工','小件配套','外膛','金工','数控预处理','结构预制','工艺准备','综合室','本部','检验室'];
const WS_MAP = {'冷加工':'冷加工车间','小件配套':'小件配套车间','外膛':'外镗车间','金工':'金工车间','数控预处理':'数控预处理车间','结构预制':'结构预制车间','工艺准备':'工艺准备室','综合室':'综合室','本部':'本部','检验室':'检验室'};
const COST_ITEMS = ['一线本工（承包）','一线本工（非承包）','电费','气体费','辅料','固定人员薪酬','基建修理费','设备修理费','维修材料','差旅交通','分包劳务','折旧费','安全生产费'];
const SPREAD_ITEMS = COST_ITEMS.filter(c=>!c.startsWith('一线'));
const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#f97316','#84cc16','#14b8a6'];
const CHART_DEFAULTS = {
  color:'#8fa3c4',
  grid:'rgba(30,45,74,.8)',
  font:{family:"'Inter','PingFang SC',sans-serif"}
};

let DB={}, availableMonths=[], curMonthIdx=0, isAdmin=false, charts={}, modalChart=null;

// ── 时钟 ─────────────────────────────────────
function tickClock(){
  const el=document.getElementById('clockBadge');
  if(el)el.textContent=new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock,1000);tickClock();

// ── 登录 ─────────────────────────────────────
function doLogin(){
  const p=document.getElementById('loginPwd').value.trim();
  if(p===ADMIN_PWD){isAdmin=true;enterApp();}
  else if(p===VIEWER_PWD){isAdmin=false;enterApp();}
  else{document.getElementById('loginErr').textContent='密码错误，请重试';document.getElementById('loginPwd').value='';}
}
function enterApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  if(isAdmin){document.getElementById('adminBar').classList.remove('hidden');document.getElementById('adminTag').style.display='inline';}
  loadSavedData();
}
function doLogout(){
  isAdmin=false;
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appRoot').classList.add('hidden');

// ── 文件解析 ─────────────────────────────────
function handleFile(i){if(i.files[0])parseExcel(i.files[0]);}
function handleDrop(e){if(e.dataTransfer.files[0])parseExcel(e.dataTransfer.files[0]);}
function setStatus(msg,type){const el=document.getElementById('uploadStatus');el.textContent=msg;el.className='upload-status status-'+type;el.style.display='block';}
function isMonthCol(v){return v instanceof Date;}

async function parseExcel(file){
  setStatus('⏳ 解析中...','loading');
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    DB={costs:{},profit:{},labor:{},nodes:{},machine:{},utilization:{}};

    COST_SHEETS.forEach(sn=>{
      if(!wb.SheetNames.includes(sn))return;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null});
      const header=rows[0]||[];const mCols={};
      header.forEach((v,i)=>{if(isMonthCol(v))mCols[i]=v.getMonth();});
      const wsData={};
      rows.slice(1).forEach(row=>{
        const item=row[1];if(!item)return;
        Object.entries(mCols).forEach(([ci,mi])=>{wsData[mi]=wsData[mi]||{};wsData[mi][item]=(wsData[mi][item]||0)+(parseFloat(row[ci])||0);});
      });
      DB.costs[sn]=wsData;
    });

    if(wb.SheetNames.includes('利润表')){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['利润表'],{header:1,defval:null});
      const header=rows[0]||[];const mCols={};
      header.forEach((v,i)=>{if(isMonthCol(v))mCols[i]=v.getMonth();});
      let curWs='';
      rows.slice(1).forEach(row=>{
        if(row[0]&&typeof row[0]==='string'&&row[0].trim())curWs=row[0].trim();
        const item=row[1];if(!item||!curWs)return;
        DB.profit[curWs]=DB.profit[curWs]||{};
        Object.entries(mCols).forEach(([ci,mi])=>{DB.profit[curWs][mi]=DB.profit[curWs][mi]||{};DB.profit[curWs][mi][item]=parseFloat(row[ci])||0;});
      });
    }

    if(wb.SheetNames.includes('劳率')){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['劳率'],{header:1,defval:null});
      const header=rows[0]||[];const mCols={};
      header.forEach((v,i)=>{
        if(typeof v==='number'&&v>40000){const d=XLSX.SSF.parse_date_code(v);mCols[i]=d.m-1;}
        else if(isMonthCol(v))mCols[i]=v.getMonth();
      });
      let cat='';
      rows.slice(1).forEach(row=>{
        if(row[0]&&typeof row[0]==='string')cat=row[0];
        const nm=row[1];if(!nm||typeof nm!=='string')return;
        const key=nm.trim();DB.labor[key]=DB.labor[key]||{};
        Object.entries(mCols).forEach(([ci,mi])=>{
          DB.labor[key][mi]=DB.labor[key][mi]||{};const v=row[ci];
          if(cat==='人数')DB.labor[key][mi].headcount=parseFloat(v)||0;
          else if(cat==='劳动生产率'&&typeof v==='number'&&v<1000)DB.labor[key][mi].labor_rate=v;
        });
      });
    }

    if(wb.SheetNames.includes('关键节点完成率')){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['关键节点完成率'],{header:1,defval:null});
      const header=rows[0]||[];const mCols={};
      ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'].forEach((m,i)=>{const ci=header.indexOf(m);if(ci>0)mCols[ci]=i;});
      let curWs='';
      rows.slice(1).forEach(row=>{
        if(row[0]&&typeof row[0]==='string')curWs=row[0].trim();
        const item=row[1];if(!item||!curWs)return;
        DB.nodes[curWs]=DB.nodes[curWs]||{};
        Object.entries(mCols).forEach(([ci,mi])=>{
          DB.nodes[curWs][mi]=DB.nodes[curWs][mi]||{};const v=row[ci];
          if(item==='完成率'&&typeof v==='number')DB.nodes[curWs][mi].node_rate=v;
          if(item==='总节点数')DB.nodes[curWs][mi].total_nodes=parseFloat(v)||0;
        });
      });
    }

    if(wb.SheetNames.includes('流机节约')){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['流机节约'],{header:1,defval:null});
      const header=rows[0]||[];const mCols={};
      header.forEach((v,i)=>{
        if(typeof v==='number'&&v>40000){const d=XLSX.SSF.parse_date_code(v);mCols[i]=d.m-1;}
        else if(isMonthCol(v))mCols[i]=v.getMonth();
      });
      let cat='';
      rows.slice(1).forEach(row=>{
        if(row[0]&&typeof row[0]==='string')cat=row[0].trim();
        const nm=row[1];if(!nm||typeof nm!=='string')return;
        const key=nm.trim();DB.machine[key]=DB.machine[key]||{};
        Object.entries(mCols).forEach(([ci,mi])=>{
          DB.machine[key][mi]=DB.machine[key][mi]||{};const v=parseFloat(row[ci])||0;
          if(cat==='花费')DB.machine[key][mi].actual=v;
          else if(cat==='定额'&&nm==='当月定额'){DB.machine['合计']=DB.machine['合计']||{};DB.machine['合计'][mi]=DB.machine['合计'][mi]||{};DB.machine['合计'][mi].quota=v;}
          else if(cat==='节约')DB.machine[key][mi].saved=v;
        });
      });
    }

    if(wb.SheetNames.includes('车间利用率')){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['车间利用率'],{header:1,defval:null});
      const header=rows[0]||[];const mCols={};
      ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'].forEach((m,i)=>{const ci=header.indexOf(m);if(ci>=0)mCols[ci]=i;});
      let curWs='';
      rows.slice(1).forEach(row=>{
        if(row[0]&&typeof row[0]==='string'&&row[0].trim()&&row[0]!=='累计')curWs=row[0].trim();
        const item=row[1];if(!item||!curWs)return;
        DB.utilization[curWs]=DB.utilization[curWs]||{};
        Object.entries(mCols).forEach(([ci,mi])=>{
          DB.utilization[curWs][mi]=DB.utilization[curWs][mi]||{};const v=parseFloat(row[ci]);
          if(item==='利用率'&&!isNaN(v))DB.utilization[curWs][mi].util_rate=v;
          if(item==='面积'&&!isNaN(v))DB.utilization[curWs][mi].area=v;
        });
      });
    }

    const cm=new Set();
    Object.values(DB.costs).forEach(ws=>Object.keys(ws).forEach(m=>cm.add(parseInt(m))));
    availableMonths=[...cm].sort((a,b)=>a-b).filter(m=>m>=0&&m<12);
    curMonthIdx=availableMonths[availableMonths.length-1]||0;
    const ok=saveData();
    initMonthSel();
    document.getElementById('dataSourceLabel').textContent=`已加载 ${availableMonths.length} 个月数据 · ${new Date().toLocaleString('zh-CN')}`;
    setStatus(`✓ 解析成功 · ${availableMonths.length} 个月份${ok?' · 已保存':''}`,'ok');
    showTab('overview',document.querySelector('.tab'));
  }catch(e){setStatus('❌ 解析失败：'+e.message,'err');console.error(e);}
}

function initMonthSel(){
  const s=document.getElementById('monthSel');
  s.innerHTML=availableMonths.map(m=>`<option value="${m}"${m===curMonthIdx?' selected':''}>${m+1}月份</option>`).join('');
  s.style.display='block';
}

// ── 工具 ─────────────────────────────────────
const W=(v,u='',d=1)=>v==null||isNaN(v)?'—':(v.toFixed(Math.abs(v%1)<0.0001?0:d))+u;
const WY=(v)=>v==null||isNaN(v)?'—':(Math.abs(v)>=10000?W(v/10000,'万'):Math.abs(v)>=1000?W(v/1000,'千'):W(v));
function getWsCost(sn,mi){
  const mo=(DB.costs[sn]||{})[mi]||{};
  const line=(mo['一线本工（承包）']||0)+(mo['一线本工（非承包）']||0);
  const spread=SPREAD_ITEMS.reduce((s,c)=>s+(mo[c]||0),0);
  return{line,spread,total:line+spread,items:mo};
}
function nodeKey(sn){return sn.replace('数控预处理','数控').replace('结构预制','预制').replace('小件配套','小件').replace('工艺准备','工艺').replace('外膛','外镗');}

  let body=`<div class="kpi-grid">
    <div class="kpi kpi-accent"><div class="kpi-label">总产值</div><div class="kpi-val">${pdata['产值（总）']?W(pdata['产值（总）']/10000,'万'):'—'}</div></div>
    <div class="kpi"><div class="kpi-label">利润</div><div class="kpi-val ${(pdata['总利润']||0)>=0?'up':'down'}">${pdata['总利润']!=null?W(pdata['总利润'],'万'):'—'}</div></div>
    <div class="kpi"><div class="kpi-label">成本合计</div><div class="kpi-val">${WY(total)}</div></div>
    <div class="kpi"><div class="kpi-label">人数</div><div class="kpi-val">${labor.headcount||'—'}${labor.headcount?'人':''}</div></div>
  </div>`;

  if(pdata['产值（总）']){
    body+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>产值构成</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      <div class="kpi"><div class="kpi-label">一线工产值</div><div class="kpi-val" style="font-size:16px">${WY(pdata['一线本工产值']||0)}</div></div>
      <div class="kpi"><div class="kpi-label">人工产值</div><div class="kpi-val" style="font-size:16px">${WY(pdata['人工产值']||0)}</div></div>
      <div class="kpi"><div class="kpi-label">分摊产值</div><div class="kpi-val" style="font-size:16px">${WY(pdata['分摊产值']||0)}</div></div>
    </div></div>`;
  }

  if(pdata['总利润']!=null){
    const lp=pdata['一线本工利润']||0;const sp=pdata['分摊利润']||0;
    body+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>利润拆分</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="kpi"><div class="kpi-label">一线工利润</div><div class="kpi-val ${lp>=0?'up':'down'}" style="font-size:16px">${W(lp,'万')}</div></div>
      <div class="kpi"><div class="kpi-label">分摊利润</div><div class="kpi-val ${sp>=0?'up':'down'}" style="font-size:16px">${W(sp,'万')}</div></div>
    </div></div>`;
  }

  body+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>成本明细</span></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">`;
  COST_ITEMS.forEach(c=>{const v=items[c]||0;if(!v)return;body+=`<div class="kpi"><div class="kpi-label">${c}</div><div class="ws-m-val" style="font-size:13px;margin-top:4px">${WY(v)}</div></div>`;});
  body+=`</div></div>`;

  const effRows=[];
  if(nd.node_rate&&nd.node_rate<2)effRows.push(['节点完成率',W(nd.node_rate*100,'%')]);
  if(labor.labor_rate)effRows.push(['劳动生产率',W(labor.labor_rate,'万/人')]);
  if(effRows.length){
    body+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>效率指标</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
    ${effRows.map(([l,v])=>`<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-val" style="font-size:16px">${v}</div></div>`).join('')}
    </div></div>`;
  }

  if(machData&&(machData.actual||machData.quota)){
    const saved=(machData.quota||0)-(machData.actual||0);const ok=saved>=0;
    body+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>流机管控</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      <div class="kpi"><div class="kpi-label">当月定额</div><div class="kpi-val" style="font-size:16px">${WY(machData.quota||0)}</div></div>
      <div class="kpi"><div class="kpi-label">实际花费</div><div class="kpi-val" style="font-size:16px">${WY(machData.actual||0)}</div></div>
      <div class="kpi"><div class="kpi-label">节约/超支</div><div class="kpi-val ${ok?'up':'down'}" style="font-size:16px">${ok?'+':'-'}${WY(Math.abs(saved))}</div></div>
    </div></div>`;
  }

  body+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>各月成本趋势</span>
    <button class="chart-expand" onclick="openChartModal('${name} · 成本趋势',function(c){return makeWsTrendChart(c,'${sn}')})">全屏 ↗</button>
  </div><div style="position:relative;height:160px"><canvas id="wsTrendC"></canvas></div></div>`;

  document.getElementById('wsModalBody').innerHTML=body;
  document.getElementById('wsModal').classList.remove('hidden');
  setTimeout(()=>{const c=document.getElementById('wsTrendC');if(c)makeWsTrendChart(c,sn);},30);
}
function closeWsModal(e){if(e&&e.target!==document.getElementById('wsModal'))return;document.getElementById('wsModal').classList.add('hidden');}

// ── 各车间看板 ────────────────────────────────

    const name=WS_MAP[sn]||sn;
    const{line,spread,total}=getWsCost(sn,mi);
    const pdata=(DB.profit[sn]||{})[mi]||{};
    const labor=(DB.labor[name]||{})[mi]||{};
    const nd=(DB.nodes[nodeKey(sn)]||{})[mi]||{};
    const nr=nd.node_rate;const pr=pdata['总利润'];
    html+=`<div class="card">
      <div class="card-title" style="font-size:13px;font-weight:700;color:var(--text1);text-transform:none;letter-spacing:0">
        <span style="display:flex;align-items:center;gap:8px"><span class="card-title-dot"></span>${name}</span>
        ${nr&&nr<2?`<span class="pill ${nr>=0.95?'pill-ok':nr>=0.85?'pill-warn':'pill-bad'}">节点 ${W(nr*100,'%',0)}</span>`:''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px">
        <div class="kpi kpi-accent"><div class="kpi-label">总产值</div><div class="kpi-val" style="font-size:16px">${pdata['产值（总）']?W(pdata['产值（总）']/10000,'万'):'—'}</div></div>
        <div class="kpi"><div class="kpi-label">利润</div><div class="kpi-val ${(pr||0)>=0?'up':'down'}" style="font-size:16px">${pr!=null?W(pr,'万'):'—'}</div></div>
        <div class="kpi"><div class="kpi-label">成本合计</div><div class="kpi-val" style="font-size:16px">${WY(total)}</div></div>
        <div class="kpi"><div class="kpi-label">人数</div><div class="kpi-val" style="font-size:16px">${labor.headcount||'—'}${labor.headcount?'人':''}</div></div>
        <div class="kpi"><div class="kpi-label">劳动生产率</div><div class="kpi-val" style="font-size:16px">${labor.labor_rate?W(labor.labor_rate,'万/人'):'—'}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px">
        <div>
          <div class="section-label" style="margin-bottom:8px">分摊成本明细</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
            ${SPREAD_ITEMS.map(c=>{const v=(getWsCost(sn,mi).items[c])||0;return v?`<div><div class="ws-m-label">${c}</div><div class="ws-m-val">${WY(v)}</div></div>`:''}).join('')}
          </div>
        </div>
        <div>
          <div class="section-label" style="margin-bottom:8px">各月成本趋势
            <button class="chart-expand" onclick="openChartModal('${name} · 成本趋势',function(c){return makeWsTrendChart(c,'${sn}')})">全屏 ↗</button>
          </div>
          <div style="position:relative;height:110px"><canvas id="wsc_${sn}"></canvas></div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('panel-workshop').innerHTML=html;
  setTimeout(()=>{COST_SHEETS.forEach(sn=>{const c=document.getElementById('wsc_'+sn);if(c)makeWsTrendChart(c,sn);});},30);
}

// ── 车间对比 ──────────────────────────────────
function renderCompare(){
  const mi=curMonthIdx;
  let html=`
  <div class="charts-row">
    <div class="card" style="margin:0">
      <div class="card-title"><span><span class="card-title-dot"></span>产值 & 利润对比</span>
        <button class="chart-expand" onclick="openChartModal('产值 & 利润对比',makeCompareOutputChart)">全屏 ↗</button>
      </div>
      <div style="position:relative;height:180px"><canvas id="cmpOut"></canvas></div>
    </div>
    <div class="card" style="margin:0">
      <div class="card-title"><span><span class="card-title-dot"></span>成本结构对比</span>
        <button class="chart-expand" onclick="openChartModal('成本结构对比',makeCompareCostChart)">全屏 ↗</button>
      </div>
      <div style="position:relative;height:180px"><canvas id="cmpCost"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><span><span class="card-title-dot"></span>节点完成率排名</span>
      <button class="chart-expand" onclick="openChartModal('节点完成率排名',makeNodeChart)">全屏 ↗</button>
    </div>
    <div style="position:relative;height:200px"><canvas id="cmpNode"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title"><span><span class="card-title-dot"></span>各车间横向汇总（${mi+1}月）</span></div>
    <div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>车间</th><th>总产值（万）</th><th>一线工产值</th><th>分摊产值</th><th>一线工工资</th><th>分摊成本</th><th>利润（万）</th><th>人数</th><th>人均产值</th><th>节点完成率</th></tr></thead><tbody>`;

  COST_SHEETS.forEach(sn=>{
    const name=WS_MAP[sn]||sn;
    const{line,spread}=getWsCost(sn,mi);
    const pdata=(DB.profit[sn]||{})[mi]||{};
    const labor=(DB.labor[name]||{})[mi]||{};
    const nd=(DB.nodes[nodeKey(sn)]||{})[mi]||{};
    const pr=pdata['总利润'];const hc=labor.headcount||0;
    const totOut=(pdata['产值（总）']||0)/10000;
    html+=`<tr>
      <td>${name}</td><td>${totOut?W(totOut,'万'):'—'}</td>
      <td>${pdata['一线本工产值']?WY(pdata['一线本工产值']):'—'}</td>
      <td>${pdata['分摊产值']?WY(pdata['分摊产值']):'—'}</td>
      <td>${WY(line)}</td><td>${WY(spread)}</td>
      <td class="${(pr||0)>=0?'up':'down'}">${pr!=null?W(pr,'万'):'—'}</td>
      <td>${hc||'—'}</td>
      <td>${hc>0?W(totOut/hc,'万/人'):'—'}</td>
      <td>${nd.node_rate&&nd.node_rate<2?W(nd.node_rate*100,'%',1):'—'}</td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('panel-compare').innerHTML=html;
  setTimeout(()=>{
    if(charts.cmpOut)charts.cmpOut.destroy();charts.cmpOut=makeCompareOutputChart(document.getElementById('cmpOut'));
    if(charts.cmpCost)charts.cmpCost.destroy();charts.cmpCost=makeCompareCostChart(document.getElementById('cmpCost'));
    if(charts.cmpNode)charts.cmpNode.destroy();charts.cmpNode=makeNodeChart(document.getElementById('cmpNode'));
  },30);
}

// ── 成本明细 ──────────────────────────────────
function renderCost(){
  const mi=curMonthIdx;
  let html=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>分摊成本明细（${mi+1}月）</span></div>
  <div style="overflow-x:auto"><table class="tbl">
  <thead><tr><th>单元</th>${COST_ITEMS.map(c=>`<th>${c}</th>`).join('')}<th>合计</th></tr></thead><tbody>`;
  COST_SHEETS.forEach(sn=>{
    const mo=(DB.costs[sn]||{})[mi]||{};
    const tot=COST_ITEMS.reduce((s,c)=>s+(mo[c]||0),0);
    html+=`<tr><td>${WS_MAP[sn]||sn}</td>${COST_ITEMS.map(c=>`<td>${mo[c]?WY(mo[c]):''}</td>`).join('')}<td style="font-weight:700;color:var(--text1)">${WY(tot)}</td></tr>`;
  });
  const tots=COST_ITEMS.map(c=>{let s=0;COST_SHEETS.forEach(sn=>s+=((DB.costs[sn]||{})[mi]||{})[c]||0);return s;});
  html+=`<tr class="tot"><td>合计</td>${tots.map(v=>`<td>${WY(v)}</td>`).join('')}<td>${WY(tots.reduce((a,b)=>a+b,0))}</td></tr>`;
  html+=`</tbody></table></div></div>`;
  document.getElementById('panel-cost').innerHTML=html;
}

// ── 利润分析 ──────────────────────────────────
function renderProfit(){
  const mi=curMonthIdx;
  let html=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>利润分析（${mi+1}月）</span></div>
  <div style="overflow-x:auto"><table class="tbl">
  <thead><tr><th>单元</th><th>总产值</th><th>一线工产值</th><th>分摊产值</th><th>一线工成本</th><th>分摊成本</th><th>总利润（万）</th></tr></thead><tbody>`;
  Object.entries(DB.profit).forEach(([nm,wd])=>{
    const p=wd[mi]||{};const pr=p['总利润']||0;
    html+=`<tr><td>${nm}</td><td>${p['产值（总）']?WY(p['产值（总）']):''}</td><td>${p['一线本工产值']?WY(p['一线本工产值']):''}</td><td>${p['分摊产值']?WY(p['分摊产值']):''}</td><td>${p['一线本工成本']?WY(p['一线本工成本']):''}</td><td>${p['分摊成本']?WY(p['分摊成本']):''}</td><td class="${pr>=0?'up':'down'}">${pr?W(pr,'万'):''}</td></tr>`;
  });
  html+=`</tbody></table></div></div>`;
  html+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>各月利润趋势</span>
    <button class="chart-expand" onclick="openChartModal('各月利润趋势',makeProfitChart)">全屏 ↗</button>
  </div><div style="position:relative;height:200px"><canvas id="profitC"></canvas></div></div>`;
  document.getElementById('panel-profit').innerHTML=html;
  setTimeout(()=>{if(charts.profit)charts.profit.destroy();charts.profit=makeProfitChart(document.getElementById('profitC'));},30);
}

// ── 效率指标 ──────────────────────────────────
function renderEfficiency(){
  const mi=curMonthIdx;
  let html=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>劳动生产率 & 人数（${mi+1}月）</span></div>
  <table class="tbl"><thead><tr><th>车间</th><th>人数</th><th>劳动生产率（万/人）</th></tr></thead><tbody>`;
  Object.entries(DB.labor).forEach(([nm,data])=>{const d=data[mi]||{};if(!d.headcount&&!d.labor_rate)return;html+=`<tr><td>${nm}</td><td>${d.headcount||'—'}</td><td>${d.labor_rate?W(d.labor_rate):''}</td></tr>`;});
  html+=`</tbody></table></div>`;
  html+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>关键节点完成率（${mi+1}月）</span>
    <button class="chart-expand" onclick="openChartModal('关键节点完成率',makeNodeChart)">全屏 ↗</button>
  </div>`;
  Object.entries(DB.nodes).forEach(([nm,data])=>{
    const d=data[mi]||{};const r=d.node_rate;if(r==null||r>=2)return;const p=r*100;
    html+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <span style="font-size:12px;min-width:76px;color:var(--text2)">${nm}</span>
      <div class="bar-bg" style="flex:1"><div class="bar-fill" style="width:${Math.min(p,100)}%;background:${p>=95?'var(--green)':p>=85?'var(--amber)':'var(--red)'}"></div></div>
      <span style="font-size:12px;font-weight:700;min-width:44px;text-align:right;color:${p>=95?'var(--green)':p>=85?'var(--amber)':'var(--red)'}">${W(p,'%',1)}</span>
    </div>`;
  });
  html+=`</div>`;
  if(Object.keys(DB.utilization).length>0){
    html+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>车间利用率（${mi+1}月）</span></div>`;
    Object.entries(DB.utilization).forEach(([nm,data])=>{const d=data[mi]||{};const r=d.util_rate;if(!r)return;html+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span style="font-size:12px;min-width:76px;color:var(--text2)">${nm}</span><span style="font-size:10px;color:var(--text3);min-width:50px">${d.area?d.area+'m²':''}</span><div class="bar-bg" style="flex:1"><div class="bar-fill" style="width:${Math.min(r,100)}%;background:var(--accent)"></div></div><span style="font-size:12px;font-weight:700;min-width:44px;text-align:right">${W(r,'%')}</span></div>`;});
    html+=`</div>`;
  }
  document.getElementById('panel-efficiency').innerHTML=html;
}

// ── 流机管控 ──────────────────────────────────
function renderMachine(){
  const mi=curMonthIdx;
  let html=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>流机定额 vs 实际（${mi+1}月）</span></div>
  <div style="overflow-x:auto"><table class="tbl">
  <thead><tr><th>车间</th><th>定额（元）</th><th>实际花费（元）</th><th>节约/超支</th><th>状态</th></tr></thead><tbody>`;
  Object.entries(DB.machine).forEach(([nm,data])=>{
    if(nm==='合计')return;const d=data[mi]||{};if(!d.actual&&!d.quota)return;
    const saved=d.saved!=null?d.saved:(d.quota||0)-(d.actual||0);const ok=saved>=0;
    html+=`<tr><td>${nm}</td><td>${WY(d.quota||0)}</td><td>${WY(d.actual||0)}</td><td class="${ok?'up':'down'}">${ok?'+':'-'} ${WY(Math.abs(saved))}</td><td><span class="pill ${ok?'pill-ok':'pill-bad'}">${ok?'✓ 未超定额':'⚠ 超出定额'}</span></td></tr>`;
  });
  html+=`</tbody></table></div></div>`;
  html+=`<div class="card"><div class="card-title"><span><span class="card-title-dot"></span>各月流机花费趋势</span>
    <button class="chart-expand" onclick="openChartModal('各月流机花费趋势',makeMachineChart)">全屏 ↗</button>
  </div><div style="position:relative;height:200px"><canvas id="machineC"></canvas></div></div>`;
  document.getElementById('panel-machine').innerHTML=html;
  setTimeout(()=>{if(charts.machine)charts.machine.destroy();charts.machine=makeMachineChart(document.getElementById('machineC'));},30);
}

// ── 路由 ─────────────────────────────────────
function showTab(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
  const r={overview:renderOverview,workshop:renderWorkshop,compare:renderCompare,cost:renderCost,profit:renderProfit,efficiency:renderEfficiency,machine:renderMachine};
  if(r[name])r[name]();
}
function onMonthChange(){
  curMonthIdx=parseInt(document.getElementById('monthSel').value);
  document.querySelector('.tab.active').click();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeChartModal();closeWsModal();}});
</script>
</body>
</html>
